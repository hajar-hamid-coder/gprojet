# Développement : docker compose -f deploy/docker-compose.yml up -d --wait
# Nécessite POSTGRES_PASSWORD (deploy/.env, voir .env.example, ou variable d'environnement).
# Environnement de l'app : Production (celui de l'image) ; /api/health est anonyme.
name: gprojet

services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: gprojet
      POSTGRES_USER: gprojet
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?definir POSTGRES_PASSWORD dans deploy/.env}
    volumes:
      - pgdata:/var/lib/postgresql   # postgres:18 : PGDATA versionné sous ce point de montage
    ports:
      - "${POSTGRES_HOST_PORT:-55433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gprojet -d gprojet"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [gprojet]

  migrations:
    build:
      context: ..
      dockerfile: deploy/docker/Dockerfile
      target: migrations
    environment:
      ConnectionStrings__Gp: Host=postgres;Port=5432;Database=gprojet;Username=gprojet;Password=${POSTGRES_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    networks: [gprojet]

  app:
    build:
      context: ..
      dockerfile: deploy/docker/Dockerfile
      target: final
    image: gprojet-app:dev
    environment:
      ConnectionStrings__Gp: Host=postgres;Port=5432;Database=gprojet;Username=gprojet;Password=${POSTGRES_PASSWORD}
    ports:
      - "${APP_HOST_PORT:-8080}:8080"
    depends_on:
      migrations:
        condition: service_completed_successfully
    networks: [gprojet]

  keycloak:
    profiles: [keycloak]
    image: quay.io/keycloak/keycloak:26.0
    command: start-dev
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      # Pas de `:?` : compose interpole aussi les services hors profil ; à définir pour --profile keycloak.
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-}
    ports:
      - "8081:8080"
    networks: [gprojet]

volumes:
  pgdata:

networks:
  gprojet:
